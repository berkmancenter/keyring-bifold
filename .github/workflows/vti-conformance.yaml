name: VTI conformance

# Upstream's own code judges what Keyring produces, on every PR that touches
# vetting or Trust Tasks. The pinned VTI SDK (vta-sdk verify_card,
# verify_statement + check_against_card) runs on a Vetting Card made by the
# shipping sendCard and on the statement Keyring's vetter makes over it,
# both really signed by a did:key. The other direction (Keyring's functions
# on upstream-computed values) is vtiConformanceVectors.test.ts, which the
# ordinary test job runs.
#
# The VTI pin and the checker are the wallet's: scripts/openvtc/PINS.json and
# scripts/openvtc/card-verify on keyring-wallet main.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/src/modules/trust-tasks/**'
      - 'packages/trust-tasks/**'
      - '.github/workflows/vti-conformance.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/core/src/modules/trust-tasks/**'
      - 'packages/trust-tasks/**'
      - '.github/workflows/vti-conformance.yaml'
  # Dispatched on main, it saves a fresh cache of the checker's build (see the cache step).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-judges-keyring:
    # ubuntu-24.04: two cold builds of the checker on ubuntu-22.04 were cut off by
    # a runner shutdown signal (exit 143) at "Build card-verify" on 11-11. Fewer
    # cargo jobs keep a cold build's memory down; a cold build is ~25-50+ min, a
    # warm one ~6 min, with two cold builds (card-verify and card-verify-v047) 180 min is a ceiling, not a target.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Memory, measured (11-11, run 42954124714): a cold build with three jobs fell
      # from 14.8 GB to 0.5 GB free over its last ~6 minutes, on the large Affinidi
      # and trust-tasks-rs crates, and the runner was killed (exit 143); disk stayed
      # at 94 GB free throughout. So one rustc at a time, no optimiser and no debug
      # info: the checker judges a handful of documents, so its speed is irrelevant.
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      # One rustc with opt-level 0 still ran out on trust-tasks-rs 0.37.2 (run
      # 42955825509), so split each crate into many small codegen units.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '256'
    name: VTI SDK accepts Keyring's card and statement
    steps:
      # Three cold builds died with a runner shutdown signal (exit 143) at
      # "Build card-verify", in the same crates each time, on two images. A full
      # disk takes the runner service down that way, so free the preinstalled
      # SDKs this job never uses and log the space before and after the builds.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Checkout bifold
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Workspace
        run: yarn build

      - name: Fetch the wallet's checker and the VTI pin
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/berkmancenter/keyring-wallet.git "$RUNNER_TEMP/wallet"
          git -C "$RUNNER_TEMP/wallet" sparse-checkout set scripts/openvtc
          vti="$(node -e "process.stdout.write(require('$RUNNER_TEMP/wallet/scripts/openvtc/PINS.json').repos['verifiable-trust-infrastructure'].sha)")"
          echo "VTI pin: $vti"
          git clone --filter=blob:none https://github.com/OpenVTC/verifiable-trust-infrastructure.git "$RUNNER_TEMP/wallet/external/verifiable-trust-infrastructure"
          git -C "$RUNNER_TEMP/wallet/external/verifiable-trust-infrastructure" checkout --detach "$vti"
          # 228: a second, separate VTI clone at the 0.47 pin, for card-verify-v047,
          # which judges the vetted/1 statement Keyring writes behind its flag.
          vti047="$(node -e "process.stdout.write(require('$RUNNER_TEMP/wallet/scripts/openvtc/PINS.json').repos['verifiable-trust-infrastructure-v047'].sha)")"
          echo "VTI 0.47 pin: $vti047"
          git clone --filter=blob:none https://github.com/OpenVTC/verifiable-trust-infrastructure.git "$RUNNER_TEMP/wallet/external/verifiable-trust-infrastructure-v047"
          git -C "$RUNNER_TEMP/wallet/external/verifiable-trust-infrastructure-v047" checkout --detach "$vti047"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Only main saves; a PR restores main's copy. A copy saved per PR was ~850 MiB of the repo's 10 GiB cache store
      # each. The checker is the wallet's main (not pinned), so a bifold PR can't change it, but a wallet change can:
      # rust-cache keys on the lockfile and toolchain it finds, so that gives a new key and a miss, never a wrong
      # restore. After a miss or an eviction, PRs build cold until a push to main on the paths above, or a run
      # dispatched on main, saves a new copy.
      - name: Cache the checker's build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            ${{ runner.temp }}/wallet/scripts/openvtc/card-verify -> target
            ${{ runner.temp }}/wallet/scripts/openvtc/card-verify-v047 -> target

      - name: Build card-verify
        working-directory: ${{ runner.temp }}/wallet/scripts/openvtc/card-verify
        # The sampler writes free disk and memory into this step's own log every
        # 15 s, so the last line before a runner kill is the state at death
        # (a later step cannot report it: a killed job runs nothing after).
        run: |
          ( while :; do echo "SAMPLE $(date -u +%H:%M:%S) disk_avail=$(df -h --output=avail / | tail -1 | tr -d ' ') mem_avail_mb=$(free -m | awk '/^Mem:/{print $7}')"; sleep 15; done ) &
          cargo build --release --locked

      - name: Disk after the first build
        run: df -h /

      - name: Build card-verify-v047
        working-directory: ${{ runner.temp }}/wallet/scripts/openvtc/card-verify-v047
        # The sampler writes free disk and memory into this step's own log every
        # 15 s, so the last line before a runner kill is the state at death
        # (a later step cannot report it: a killed job runs nothing after).
        run: |
          ( while :; do echo "SAMPLE $(date -u +%H:%M:%S) disk_avail=$(df -h --output=avail / | tail -1 | tr -d ' ') mem_avail_mb=$(free -m | awk '/^Mem:/{print $7}')"; sleep 15; done ) &
          cargo build --release --locked

      - name: Keyring makes a card and a statement
        working-directory: packages/core
        run: CARD_OUT="$RUNNER_TEMP/conformance" TZ=GMT yarn jest src/modules/trust-tasks/__tests__/cardConformance.test.ts

      # The same documents with every clock read on a whole second: each
      # timestamp is one toISOString() writes as `.000Z`, which vta-sdk
      # re-serialises without the fraction before checking a proof. Signed
      # as-is, those were refused about once in a thousand documents, at
      # random; this run makes that case happen every time.
      - name: Keyring makes them again on a whole second
        working-directory: packages/core
        run: CONFORMANCE_WHOLE_SECOND=1 CARD_OUT="$RUNNER_TEMP/conformance-whole-second" TZ=GMT yarn jest src/modules/trust-tasks/__tests__/cardConformance.test.ts

      - name: VTI SDK judges them
        # Each proof must be for the purpose vta-sdk signs its type for
        # (purpose_for_document_type): card-verify checks it with upstream's own function.
        env:
          CARD_VERIFY_EXPECT_PURPOSE: '1'
        run: |
          bin="$RUNNER_TEMP/wallet/scripts/openvtc/card-verify/target/release/card-verify"
          # The checker at the main pin is a DTG Credentials v1 build (vta-sdk
          # 0.55 on): it refuses the endorsement-shaped statement and takes only
          # a role VAC as the vetter's grant. One that is not cannot judge below.
          if [ "$("$bin" shape 2>/dev/null)" != v1 ]; then
            echo "::error::card-verify at the main pin is not a DTG Credentials v1 build (\`card-verify shape\` did not print v1)"
            exit 1
          fi
          for out in "$RUNNER_TEMP/conformance" "$RUNNER_TEMP/conformance-whole-second"; do
            echo "== $out"
            "$bin" "$out/card.json" "$out/expect.json"
            # The vetted/1 statement against its card and the session it cites,
            # and the presentation whose grant is a role VAC.
            "$bin" verify-statement "$out/statement-v1.json" "$out/card.json" "$out/session.json" "$out/expect.json"
            "$bin" verify-eligibility "$out/eligibility-v1.json" "$out/expect.json" eligibilityV1
            "$bin" verify-task "$out/task-applicant.json" "$(node -e "process.stdout.write(require('$out/signers.json').applicant)")"
            "$bin" verify-task "$out/task-vetter.json" "$(node -e "process.stdout.write(require('$out/signers.json').vetter)")"
          done

      # 228 writer: the vetted/1 statement Keyring's vetter writes with
      # setDtgV1WritingEnabled(true) (cardConformance writes statement-v1.json and
      # the session document it cites), judged by VTI 0.47's own SDK as an openvtc
      # applicant on 0.47 judges it: verify_statement, check_against_card,
      # check_against_session. The step above judges the same statement at the
      # main pin.
      - name: VTI 0.47 SDK judges the vetted/1 statement (flag on)
        run: |
          bin="$RUNNER_TEMP/wallet/scripts/openvtc/card-verify-v047/target/release/card-verify-v047"
          for out in "$RUNNER_TEMP/conformance" "$RUNNER_TEMP/conformance-whole-second"; do
            echo "== $out"
            "$bin" verify-statement "$out/statement-v1.json" "$out/card.json" "$out/session.json" "$out/expect.json"
          done

      # Every Trust Task document Keyring signs — to a peer, a community, its
      # VTA — made by the shipping code (cardConformance.test.ts writes each to
      # tasks/<name>.json and lists it in tasks.json with its expected signer).
      # verify-task runs vta-sdk verify_trust_task_proof_with, what a VTA or a
      # VTC runs on each task it receives. The test itself holds issuer ==
      # signer and the type until card-verify checks them.
      - name: VTI SDK judges every Trust Task Keyring signs
        # Each proof must be for the purpose vta-sdk signs its type for
        # (purpose_for_document_type): card-verify checks it with upstream's own function.
        env:
          CARD_VERIFY_EXPECT_PURPOSE: '1'
        run: |
          bin="$RUNNER_TEMP/wallet/scripts/openvtc/card-verify/target/release/card-verify"
          for out in "$RUNNER_TEMP/conformance" "$RUNNER_TEMP/conformance-whole-second"; do
            node -e "for (const t of require('$out/tasks.json')) console.log(t.file + '\t' + t.signer)" > "$RUNNER_TEMP/tasks.tsv"
            count=0
            while IFS=$'\t' read -r file signer; do
              echo "$out/$file"
              "$bin" verify-task "$out/$file" "$signer"
              count=$((count + 1))
            done < "$RUNNER_TEMP/tasks.tsv"
            echo "vta-sdk verified $count Trust Task documents"
            # A list that came out short means a producer was dropped, not passed.
            test "$count" -ge 23
          done

      # What was refused, byte for byte: every document both runs wrote.
      - name: Keep the documents upstream refused
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-documents
          path: |
            ${{ runner.temp }}/conformance
            ${{ runner.temp }}/conformance-whole-second
          retention-days: 14
