name: Roadmap card status

# A pull request that says `Refs berkmancenter/keyring-wallet#N` (or `Refs #N` for a
# bifold issue) moves that card to "In progress" on the Keyring Roadmap. The script
# lives in keyring-wallet (scripts/roadmap/pr-status.mjs) and is read from its main
# branch. pull_request_target runs this workflow from the base branch, and the PR's
# own code is never checked out. Until the ROADMAP_TOKEN secret exists the job
# moves nothing.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  move-cards:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: berkmancenter/keyring-wallet
          ref: main
          sparse-checkout: scripts/roadmap
      - name: Move referenced cards to In progress
        env:
          ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
          ROADMAP_PROJECT_ID: PVT_kwDOAAIAlc4BpB-A
        run: node scripts/roadmap/pr-status.mjs
