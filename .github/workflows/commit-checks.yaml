name: Commit Requirements

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-and-signature:
    runs-on: ubuntu-22.04
    name: DCO sign-off and commit signature
    steps:
      - name: Check every commit in this PR is signed off and cryptographically signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fail=0

          commits=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[] | @base64')

          for row in $commits; do
            data=$(echo "$row" | base64 -d)
            sha=$(echo "$data" | jq -r '.sha')
            author_login=$(echo "$data" | jq -r '.author.login // empty')
            message=$(echo "$data" | jq -r '.commit.message')
            parents=$(echo "$data" | jq -r '.parents | length')
            verified=$(echo "$data" | jq -r '.commit.verification.verified')
            reason=$(echo "$data" | jq -r '.commit.verification.reason')

            # Dependabot can't add a DCO sign-off, but its commits are already
            # GitHub-verified, so only the sign-off check is skipped for it.
            if [ "$author_login" = "dependabot[bot]" ]; then
              if [ "$verified" != "true" ]; then
                echo "::error::Commit $sha (dependabot) is not cryptographically verified by GitHub (reason: $reason)"
                fail=1
              fi
              continue
            fi

            # A merge commit's sign-off is skipped, and its signature is not.
            #
            # `git pull` on a shared branch writes "Merge remote-tracking
            # branch ..." with no trailer and no chance to add one, so every
            # such pull made a branch unmergeable until its history was
            # rewritten — which on 2026-10-15 meant rewriting 42 commits of a
            # branch whose tree had already shipped. The sign-off attests to
            # authorship, and a merge introduces no new authored lines of its
            # own; the signature still proves who made it, so that check stays.
            #
            # The cost, stated rather than hidden: a conflict resolved inside a
            # merge IS authored work, and it is no longer covered by a trailer.
            # Reviewers see those resolutions in the PR diff, which is where
            # they would be judged anyway.
            if [ "$parents" -gt 1 ]; then
              if [ "$verified" != "true" ]; then
                echo "::error::Merge commit $sha is not cryptographically verified by GitHub (reason: $reason)"
                fail=1
              fi
              continue
            fi

            if ! printf '%s\n' "$message" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a DCO Signed-off-by trailer (see CONTRIBUTING.md)"
              fail=1
            fi

            if [ "$verified" != "true" ]; then
              echo "::error::Commit $sha is not cryptographically verified by GitHub (reason: $reason). Configure commit signing: https://docs.github.com/en/authentication/managing-commit-signature-verification"
              fail=1
            fi
          done

          exit $fail
