name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Linting and formatter
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: Run formatter
        run: |
          # The root `yarn prettier` script has no --check: it prints formatted output and
          # exits 0, so this step passed on every PR regardless of formatting. Check for real,
          # scoped to changed files on PRs (repo-wide has pre-existing debt, same as lint).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED="$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(js|jsx|json|ts|tsx|md|yml|yaml)$' | grep -vE '^(samples/app/(ios|android)/|.*/node_modules/)' || true)"
            if [ -z "$CHANGED" ]; then
              echo "No formattable files changed; skipping prettier"
              exit 0
            fi
            echo "$CHANGED" | xargs npx prettier --check
          else
            yarn prettier --check || echo "::warning::Repo-wide prettier check failed (known debt); not blocking main pushes yet"
          fi

      - name: Run linter
        run: |
          # Full-repo lint has pre-existing debt (~90+ errors on main). On PRs, lint changed JS/TS only.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            CHANGED="$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(js|jsx|ts|tsx)$' || true)"
            if [ -z "$CHANGED" ]; then
              echo "No JS/TS files changed; skipping lint"
              exit 0
            fi
            echo "$CHANGED" | xargs eslint --color
          else
            yarn lint || echo "::warning::Full-repo lint failed (known debt); not blocking main pushes yet"
          fi

      - name: testids extractor tests
        run: |
          node --test packages/core/scripts/gen-testids.test.mjs

      - name: testids manifest is current
        run: |
          # packages/core/testids.json lists every testID key in core; the wallet's e2e
          # drivers read it. A PR that adds, removes or renames a testID, or moves one to
          # another file, must regenerate it (`yarn testids` in packages/core) so the
          # drivers see the change. Line shifts do not count, so a PR whose base moved
          # after its last push does not go stale on merge.
          node packages/core/scripts/gen-testids.mjs --check

  test:
    runs-on: ubuntu-22.04
    name: Testing
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: Automated testing
        run: |
          yarn coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()
