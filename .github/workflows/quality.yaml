name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Linting and formatter
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The changed-files step diffs the PR against its base with a three-dot range,
          # which needs the merge base. The default shallow checkout (depth 1) has no
          # parents for the merge commit, that diff failed, and the formatter and linter
          # steps "skipped" on PRs that changed many files.
          fetch-depth: 0

      - name: Changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # The formatter and linter steps check only the files this PR changes (the
          # repo-wide runs carry pre-existing debt). The list is computed once, here, and
          # any failure to compute it fails the job instead of leaving an empty list that
          # the steps below would read as "nothing to check".
          BASE="origin/${BASE_REF}"
          if ! git merge-base "$BASE" HEAD >/dev/null; then
            echo "::error::No merge base between $BASE and HEAD; the checkout is too shallow to diff the PR"
            exit 1
          fi
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/changed-files-all.txt"
          if [ ! -s "$RUNNER_TEMP/changed-files-all.txt" ] && [ "${PR_CHANGED_FILES:-0}" -gt 0 ]; then
            echo "::error::The diff against $BASE is empty, but GitHub lists $PR_CHANGED_FILES changed files in this PR; refusing to pass without checking anything"
            git diff --stat "$BASE...HEAD" || true
            exit 1
          fi
          # Deleted files cannot be formatted or linted; keep added, copied, modified, renamed, type-changed.
          git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          echo "Files changed against $BASE ($(wc -l < "$RUNNER_TEMP/changed-files.txt" | tr -d ' ') to check):"
          cat "$RUNNER_TEMP/changed-files.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: Run formatter
        run: |
          # The root `yarn prettier` script has no --check: it prints formatted output and
          # exits 0, so this step passed on every PR regardless of formatting. Check for real,
          # scoped to changed files on PRs (repo-wide has pre-existing debt, same as lint).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(grep -E '\.(js|jsx|mjs|cjs|json|ts|tsx|md|yml|yaml)$' "$RUNNER_TEMP/changed-files.txt" | grep -vE '^(samples/app/(ios|android)/|.*/node_modules/)' || true)"
            if [ -z "$CHANGED" ]; then
              echo "No formattable files changed; skipping prettier"
              exit 0
            fi
            echo "$CHANGED" | xargs npx prettier --check
          else
            yarn prettier --check || echo "::warning::Repo-wide prettier check failed (known debt); not blocking main pushes yet"
          fi

      - name: Run linter
        run: |
          # Full-repo lint has pre-existing debt (~90+ errors on main). On PRs, lint changed JS/TS only.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' "$RUNNER_TEMP/changed-files.txt" || true)"
            if [ -z "$CHANGED" ]; then
              echo "No JS/TS files changed; skipping lint"
              exit 0
            fi
            # Through yarn: eslint is a workspace dev dependency, not on the runner's PATH (a bare
            # `xargs eslint` exits 127, which went unseen while the changed-files list came out empty).
            echo "$CHANGED" | xargs yarn eslint --color
          else
            yarn lint || echo "::warning::Full-repo lint failed (known debt); not blocking main pushes yet"
          fi

      - name: testids extractor tests
        run: |
          node --test packages/core/scripts/gen-testids.test.mjs

      - name: testids manifest is current
        run: |
          # packages/core/testids.json lists every testID key in core; the wallet's e2e
          # drivers read it. A PR that adds, removes or renames a testID, or moves one to
          # another file, must regenerate it (`yarn testids` in packages/core) so the
          # drivers see the change. Line shifts do not count, so a PR whose base moved
          # after its last push does not go stale on merge.
          node packages/core/scripts/gen-testids.mjs --check

      - name: emoji data tests
        run: |
          node --test packages/core/scripts/emoji/generate-emoji-data.test.mjs

      - name: emoji data is current
        run: |
          # packages/core/src/modules/chat/emoji/emoji-data.json is generated from the
          # vendored Unicode and CLDR files in packages/core/scripts/emoji/sources/. A PR
          # that changes either must regenerate it (`yarn emoji` in packages/core).
          node packages/core/scripts/emoji/generate-emoji-data.mjs --check

  test:
    runs-on: ubuntu-22.04
    name: Testing
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: Automated testing
        run: |
          yarn coverage

      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()

  typecheck:
    runs-on: ubuntu-22.04
    # Not a required check yet: it is watched for about a week before that is decided.
    name: Type check (ratchet)
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      # A fresh install, so tsc checks against the dependencies that ship (a
      # developer checkout can hold stale nested copies that change the result).
      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: tsc-ratchet tests
        run: |
          node --test scripts/tsc-ratchet.test.mjs

      - name: No new type errors in @bifold/core
        run: |
          # Build Workspace already type-checks core's src (bob's typescript target),
          # but core's tsconfig excludes the test files and jest strips types, so
          # this is the only place the tests are type-checked. tsconfig.ratchet.json
          # adds them back. Policy: src has no type errors; test files get no new
          # ones, and packages/core/tsc-baseline.txt only shrinks. A new entry needs
          # a named reason in the PR body and the review lane's explicit agreement
          # (scripts/tsc-ratchet.mjs). It fails on a new error, on a count that
          # rises, on a count that falls without the baseline being rewritten in
          # the same PR, and on a tsc run that fails without a diagnostic.
          node scripts/tsc-ratchet.mjs --package packages/core --project tsconfig.ratchet.json
