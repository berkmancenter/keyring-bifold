name: Code Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    name: Linting and formatter
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The changed-files step diffs the PR against its base with a three-dot range,
          # which needs the merge base. The default shallow checkout (depth 1) has no
          # parents for the merge commit, that diff failed, and the formatter and linter
          # steps "skipped" on PRs that changed many files.
          fetch-depth: 0

      - name: Changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          # The formatter and linter steps check only the files this PR changes (the
          # repo-wide runs carry pre-existing debt). The list is computed once, here, and
          # any failure to compute it fails the job instead of leaving an empty list that
          # the steps below would read as "nothing to check".
          BASE="origin/${BASE_REF}"
          if ! git merge-base "$BASE" HEAD >/dev/null; then
            echo "::error::No merge base between $BASE and HEAD; the checkout is too shallow to diff the PR"
            exit 1
          fi
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/changed-files-all.txt"
          if [ ! -s "$RUNNER_TEMP/changed-files-all.txt" ] && [ "${PR_CHANGED_FILES:-0}" -gt 0 ]; then
            echo "::error::The diff against $BASE is empty, but GitHub lists $PR_CHANGED_FILES changed files in this PR; refusing to pass without checking anything"
            git diff --stat "$BASE...HEAD" || true
            exit 1
          fi
          # Deleted files cannot be formatted or linted; keep added, copied, modified, renamed, type-changed.
          git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          echo "Files changed against $BASE ($(wc -l < "$RUNNER_TEMP/changed-files.txt" | tr -d ' ') to check):"
          cat "$RUNNER_TEMP/changed-files.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: Run formatter
        run: |
          # The root `yarn prettier` script has no --check: it prints formatted output and
          # exits 0, so this step passed on every PR regardless of formatting. Check for real,
          # scoped to changed files on PRs (repo-wide has pre-existing debt, same as lint).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(grep -E '\.(js|jsx|mjs|cjs|json|ts|tsx|md|yml|yaml)$' "$RUNNER_TEMP/changed-files.txt" | grep -vE '^(samples/app/(ios|android)/|.*/node_modules/)' || true)"
            if [ -z "$CHANGED" ]; then
              echo "No formattable files changed; skipping prettier"
              exit 0
            fi
            echo "$CHANGED" | xargs npx prettier --check
          else
            yarn prettier --check || echo "::warning::Repo-wide prettier check failed (known debt); not blocking main pushes yet"
          fi

      - name: Run linter
        run: |
          # Full-repo lint has pre-existing debt (~90+ errors on main). On PRs, lint changed JS/TS only.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED="$(grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' "$RUNNER_TEMP/changed-files.txt" || true)"
            if [ -z "$CHANGED" ]; then
              echo "No JS/TS files changed; skipping lint"
              exit 0
            fi
            # Through yarn: eslint is a workspace dev dependency, not on the runner's PATH (a bare
            # `xargs eslint` exits 127, which went unseen while the changed-files list came out empty).
            echo "$CHANGED" | xargs yarn eslint --color
          else
            yarn lint || echo "::warning::Full-repo lint failed (known debt); not blocking main pushes yet"
          fi

      - name: testids extractor tests
        run: |
          node --test packages/core/scripts/gen-testids.test.mjs

      - name: testids manifest is current
        run: |
          # packages/core/testids.json lists every testID key in core; the wallet's e2e
          # drivers read it. A PR that adds, removes or renames a testID, or moves one to
          # another file, must regenerate it (`yarn testids` in packages/core) so the
          # drivers see the change. Line shifts do not count, so a PR whose base moved
          # after its last push does not go stale on merge.
          node packages/core/scripts/gen-testids.mjs --check

      - name: emoji data tests
        run: |
          node --test packages/core/scripts/emoji/generate-emoji-data.test.mjs

      - name: emoji data is current
        run: |
          # packages/core/src/modules/chat/emoji/emoji-data.json is generated from the
          # vendored Unicode and CLDR files in packages/core/scripts/emoji/sources/. A PR
          # that changes either must regenerate it (`yarn emoji` in packages/core).
          node packages/core/scripts/emoji/generate-emoji-data.mjs --check

      - name: test selector tests
        run: |
          node --test scripts/ci/select-tests.test.mjs

      - name: every other node test
        run: |
          # A *.test.mjs that no step names still runs here: an explicit list silently leaves a new one out
          # (eslint-rules/require-testid.test.mjs never ran before this step).
          named=$(grep -ohE 'node --test [^ ]+\.test\.mjs' .github/workflows/*.yaml | awk '{print $3}' | sort -u)
          files=$(git ls-files '*.test.mjs' | grep -vxF "$named" || true)
          echo "Not named by any step:"
          echo "${files:-  (none)}"
          if [ -n "$files" ]; then node --test $files; fi

  # On a PR, Testing runs only the suites the change can reach, plus every guard (scripts/ci/select-tests.mjs says
  # which and why). The full suite with coverage runs on every push to main, nightly, and on dispatch:
  # the "Full test suite" workflow. The selection runs in four parts at once, each on its own runner
  # (core's suites split by jest's --shard); the job named Testing, which the ruleset requires, passes only when
  # every part passes.
  test-part:
    runs-on: ubuntu-22.04
    name: Testing part ${{ matrix.part }}/4
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    # Every part reports the same scope: the whole selection, not its share.
    outputs:
      scope: ${{ steps.run.outputs.scope || steps.plan.outputs.scope }}
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The selector diffs the PR against its merge base.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      - name: Select tests
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          node scripts/ci/select-tests.mjs plan --base "origin/${BASE_REF}" --out "$RUNNER_TEMP/test-plan.json"

      # node_modules and yarn's cache, keyed on everything the install reads. The install still runs: on a hit it only
      # checks and relinks.
      - name: Restore dependencies
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            samples/*/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: deps-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/patches/**', 'package.json', 'packages/*/package.json', 'samples/*/package.json', '.github/actions/setup-node/action.yaml') }}

      - name: Install dependencies
        if: steps.plan.outputs.work == 'true'
        run: |
          yarn install --immutable

      # Only the packages the selected tests load (a rooms-only PR: core's dependencies, about 20 s), not the whole
      # workspace. Not cached: that would save about 20 s, and only for a PR's own re-runs.
      - name: Build what the tests load
        if: steps.plan.outputs.work == 'true' && steps.plan.outputs.build != ''
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          if [ "$BUILD" = all ]; then
            yarn build
          else
            set -- $BUILD
            args=()
            for name in "$@"; do args+=(--include "$name"); done
            yarn workspaces foreach --all --topological-dev -p "${args[@]}" run build
          fi

      # Jest's transform cache (babel output per file, keyed by jest on content and config), so a run re-transforms
      # only what changed. Restored from the newest run with the same dependencies and config.
      #
      # One entry per pull request and part, not per push: a key is never saved twice, so a PR's entry is written on
      # its first push and its later pushes restore it and write nothing (four entries per PR instead of four per push,
      # in a store at its size limit). Files a later push changes re-transform on each run, so a long-lived PR gets
      # less from it over time; that is the trade. A push to main keeps its sha, or main's entry would freeze at its
      # first save. A PR that changes yarn.lock or core's babel or jest config gets a new key each push, as it must.
      # The `-part<N>-` fallback matches every ref's entries; a run reads only its own ref's caches and its base
      # branch's (GitHub's cache scoping), which is what keeps one PR from restoring another's. That holds only while
      # this never runs on a ref PRs share.
      - name: Restore jest's cache
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/core/.jest/cache
          key: jest-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/core/babel.config.js', 'packages/core/jest.config.js') }}-part${{ matrix.part }}-${{ github.event_name == 'push' && format('{0}-{1}', github.ref, github.sha) || github.ref }}
          restore-keys: |
            jest-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/core/babel.config.js', 'packages/core/jest.config.js') }}-part${{ matrix.part }}-refs/heads/main-
            jest-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/core/babel.config.js', 'packages/core/jest.config.js') }}-part${{ matrix.part }}-

      # Jest's default workers: on the runner's 4 vCPUs that leaves one free for jest itself and the tests' timers.
      # Four workers measured 0.3 min faster (within one run's noise) and left 1 s waits short of CPU.
      - name: Automated testing
        id: run
        if: steps.plan.outputs.work == 'true'
        env:
          PART: ${{ matrix.part }}/4
        run: |
          node scripts/ci/select-tests.mjs run --plan "$RUNNER_TEMP/test-plan.json" --part "$PART"

  test:
    runs-on: ubuntu-22.04
    name: Testing
    needs: test-part
    if: always() && github.event_name == 'pull_request'
    outputs:
      scope: ${{ needs.test-part.outputs.scope }}
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.test-part.result }}
          SCOPE: ${{ needs.test-part.outputs.scope }}
        run: |
          echo "Testing ran: ${SCOPE:-unknown}; parts: $RESULT"
          test "$RESULT" = success

  # Not required. Its name carries what Testing ran ("@bifold/core subset 63 of 704", "full suite"), where a merge
  # waiter can read it through the API (a job's name; a check run's summary is not readable there). Not run-name:
  # that is fixed before the selection runs, and it replaces the run's `name`, which waiters match on.
  scope:
    name: Testing scope · ${{ needs.test.outputs.scope || 'unknown' }}
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Scope
        env:
          SCOPE: ${{ needs.test.outputs.scope }}
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Testing ran: ${SCOPE:-unknown} (result: $RESULT)"

  typecheck:
    runs-on: ubuntu-22.04
    # Not a required check yet: it is watched for about a week before that is decided.
    name: Type check (ratchet)
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      # A fresh install, so tsc checks against the dependencies that ship (a
      # developer checkout can hold stale nested copies that change the result).
      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      - name: tsc-ratchet tests
        run: |
          node --test scripts/tsc-ratchet.test.mjs

      - name: No new type errors in @bifold/core
        run: |
          # Build Workspace already type-checks core's src (bob's typescript target),
          # but core's tsconfig excludes the test files and jest strips types, so
          # this is the only place the tests are type-checked. tsconfig.ratchet.json
          # adds them back. Policy: src has no type errors; test files get no new
          # ones, and packages/core/tsc-baseline.txt only shrinks. A new entry needs
          # a named reason in the PR body and the review lane's explicit agreement
          # (scripts/tsc-ratchet.mjs). It fails on a new error, on a count that
          # rises, on a count that falls without the baseline being rewritten in
          # the same PR, and on a tsc run that fails without a diagnostic.
          node scripts/tsc-ratchet.mjs --package packages/core --project tsconfig.ratchet.json
