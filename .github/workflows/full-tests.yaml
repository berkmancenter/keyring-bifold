name: Full test suite
# Every package's whole jest suite, with coverage: core in four shards, the other packages in a fifth job. A PR's
# Testing job (quality.yaml) runs only the suites its change can reach; this is what catches anything that selection
# misses, within one merge. Gate on the job "Full suite": it is green only when every shard is.
run-name: >-
  ${{ github.event_name == 'pull_request'
  && format('Full test suite · {0}', github.event.pull_request.title)
  || format('Full test suite · {0} · {1}', github.event_name, github.sha) }}

on:
  push:
    branches: [main]
  schedule:
    # Nightly, on main's head.
    - cron: '23 7 * * *'
  workflow_dispatch:
  # On a PR only when it carries the `full-tests` label.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests')
    runs-on: ubuntu-22.04
    name: Full suite (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [core 1/4, core 2/4, core 3/4, core 4/4, other packages]
    steps:
      - name: Checkout aries-mobile-agent-react-native
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup NodeJS
        uses: ./.github/actions/setup-node

      # The same key as quality.yaml's Testing job, so a run on main seeds the cache PRs restore.
      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            samples/*/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: deps-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', '.yarn/patches/**', 'package.json', 'packages/*/package.json', 'samples/*/package.json', '.github/actions/setup-node/action.yaml') }}

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build Workspace
        run: |
          yarn build

      # A shard can hold no test of a small package, hence --passWithNoTests; core's never empties. The other
      # packages run unsharded, so their coverage thresholds (remote-logs) still see the whole suite.
      - name: Automated testing with coverage
        env:
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            core\ *) yarn workspace @bifold/core run coverage --ci --shard="${PART#core }" ;;
            *) yarn workspaces foreach --all --topological-dev --exclude @bifold/core run coverage --ci ;;
          esac

      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()

  full:
    name: Full suite
    needs: shard
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-tests'))
    runs-on: ubuntu-22.04
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success
